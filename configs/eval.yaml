# Eval config: identical settings for the base and fine-tuned runs.

eval_set:
  n_classification: 200      # number of classification examples to evaluate
  n_qa: 200                  # number of QA examples to evaluate
  qa_present_ratio: 0.5      # balance present/absent so fabrication rate is measurable
  seed: 1234                 # random seed for reproducibility

generation:
  do_sample: false           # greedy: deterministic, comparable runs
  max_new_tokens_classification: 16     # classification: short answers, 16 tokens max
  max_new_tokens_qa: 384
  # Same batch sizes for base and fine-tuned runs (padding can flip a greedy token).
  # QA batch 1 fits the 6GB local GPU at ~1.7k-token prompts.
  batch_size_classification: 4
  batch_size_qa: 1

scoring:
  # grounding: exact whole-word match after normalization (case/punctuation/whitespace);
  # fuzzy matching let changed numbers and negations through (see eval/grounding.py)
  ece_bins: 10               # number of bins for expected calibration error (ECE) calculation

outputs:
  predictions_dir: results/predictions
  report_path: results/comparison.md
